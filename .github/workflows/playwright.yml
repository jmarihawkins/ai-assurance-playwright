name: Playwright assurance checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run catches runner image and action changes even when nothing is pushed.
  schedule:
    - cron: '0 13 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run assurance checks
        run: npm test
        env:
          AI_MODE: mock

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14